services:
  postgres:
    image: postgres:17
    container_name: social-dating-postgres
    environment:
      POSTGRES_USER: social_dating
      POSTGRES_PASSWORD: social_dating_dev
      POSTGRES_DB: social_dating
    ports:
      - "5433:5432"
    volumes:
      - social_dating_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_dating -d social_dating"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  social_dating_pg:
